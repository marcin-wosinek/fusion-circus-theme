name: Build theme ZIP

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip theme
        run: zip -r fusion-circus.zip fusion-circus -x '.DS_Store'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fusion-circus
          path: fusion-circus.zip
          retention-days: 90
